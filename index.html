<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Are you Noob?</title>
  <link rel="stylesheet" href="noob.css">
</head>
<body>
  <main class="page">
    <div class="emoji">🤨</div>
    <h1>Are you <span>Noob</span>?</h1>
    <p class="subtitle">Be honest...</p>

    <div class="button-area" id="buttonArea">
      <button id="yesBtn" class="btn yes">Yes</button>
      <button id="noBtn" class="btn no">No</button>
    </div>

    <p id="tease" class="tease">Try clicking "Yes" 😏</p>
  </main>
  <script src="noob.js"></script>
</body>
</html>
